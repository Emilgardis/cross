name: Try
on:
  issue_comment:
    types: [created]
jobs:
  check-command:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') && contains(github.event.comment.body, '/ci try')
    outputs:
      try: ${{ steps.check.outputs.try }}
    steps:
      # keep in sync with `find_try_command` in xtask/src/ci/target_matrix.rs
      - name: Check for command
        id: check
        run: |
          if grep -qE '^`*/ci try([[:space:]`]|$)' <<< "${COMMENT_BODY//$'\r'/}"; then
            echo "try=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
  acknowledge:
    runs-on: ubuntu-latest
    needs: check-command
    if: needs.check-command.outputs.try == 'true'
    steps:
      - uses: actions/checkout@v3
      - name: Acknowledge command
        id: acknowledge
        run: |
          gh pr comment ${{ github.event.issue.number }} --body "<!--try-ack-comment-->
          Starting try run. [Link to action](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.issue.number }})"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
  try:
    needs: check-command
    if: needs.check-command.outputs.try == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      matrix-args: try --pr ${{ github.event.issue.number }}
      try-comment: ${{ github.event.comment.body }}
      checkout-ref: refs/pull/${{ github.event.issue.number }}/head
  comment:
    needs: [try, acknowledge]
    if: always() && needs.try.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      # NOTE: PR can't change try.jq since we checkout in issue_comment context
      - uses: actions/checkout@v3
      - name: Minimize existing comments
        run: |
          COMMENTS=$(gh pr view ${{ github.event.issue.number }} --json comments --jq '.comments[] | select((.body | contains("<!--try-conclusion-comment-->") or contains("<!--try-ack-comment-->")) and (.author.login == "github-actions") and (.isMinimized | not)) | .id')
          while read -r comment_id; do
            gh api graphql -f query='mutation { minimizeComment(input: { classifier: OUTDATED, subjectId: "'"$comment_id"'" }) { minimizedComment { isMinimized } } }'
          done <<< "$COMMENTS"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Comment on PR
        run: |
          gh run view "$RUN_ID" --json jobs > "$RUNNER_TEMP/jobs.json"
          # annotations, for the steps in `cargo xtask target-test` that failed
          jq -r '.jobs[] | select(.conclusion == "failure") | .databaseId' "$RUNNER_TEMP/jobs.json" | head -n 100 |
          while read -r job_id; do
            gh api "repos/$GITHUB_REPOSITORY/check-runs/$job_id/annotations" < /dev/null |
              jq -c --arg id "$job_id" '{($id): .}'
          done | jq -s 'add // {}' > "$RUNNER_TEMP/annotations.json"

          jq -r -f .github/workflows/try.jq \
            --arg pr_id "$PR_ID" \
            --arg comment "$COMMENT_URL" \
            --arg try_error "$TRY_ERROR" \
            --argjson annotations "$(< "$RUNNER_TEMP/annotations.json")" \
            "$RUNNER_TEMP/jobs.json" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_ID" --body-file "$RUNNER_TEMP/comment.md"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          PR_ID: ${{ github.event.issue.number }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          TRY_ERROR: ${{ needs.try.outputs.try-error }}
